name: 自动更新开奖数据

on:
  schedule:
    # 双色球每周二、四、日 21:15（北京时间）开奖
    # 北京时间 21:50 = UTC 13:50，开奖后拉取最新数据
    - cron: "50 13 * * 0,2,4"
  workflow_dispatch:      # 支持在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 拉取最新开奖数据并生成静态统计文件
        run: python tools/update_data.py

      - name: 提交并推送（有变更时）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ssq_data.json static/data/
          if git diff --cached --quiet; then
            echo "无新数据，跳过提交"
          else
            git commit -m "chore: 自动更新开奖数据 $(date +%F) [skip ci]"
            git push
          fi
